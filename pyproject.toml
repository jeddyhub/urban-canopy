[project]
name = "canopy"
version = "0.1.0"
description = "Equity-constrained tree planting allocation for Denver, CO"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio",
    "pyproj",
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "contextily",
    "libpysal",
    "esda",
    "pulp",
    "pygris",
    "census",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["jupyterlab", "ipykernel", "nbstripout", "pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]