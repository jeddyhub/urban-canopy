name: canopy
channels:
  - conda-forge
dependencies:
  - python=3.11
  # --- geospatial core ---
  - geopandas>=1.0      # pandas with a geometry column
  - shapely>=2.0        # geometry objects and predicates
  - pyogrio             # fast vector file reading (backs geopandas)
  - pyproj              # coordinate reference system transforms
  - rasterio            # only needed if you move to raster canopy later
  # --- analysis ---
  - pandas
  - numpy
  - scipy
  - libpysal            # spatial weights matrices
  - esda                # Moran's I and friends
  # --- optimisation ---
  - pulp                # LP/MILP modelling; bundles the CBC solver
  - highspy             # faster open-source solver, optional
  # --- census access ---
  - pygris              # TIGER/Line boundaries
  - census              # ACS API client
  - python-dotenv       # read the API key out of .env
  # --- figures and notebooks ---
  - matplotlib
  - contextily          # basemap tiles under your maps
  - jupyterlab
  - nbstripout          # strips notebook outputs before commit
  - pip
  - pip:
      - -e .
